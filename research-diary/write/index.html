<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; connect-src https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Writing · Zitong's Notes</title>
  <script src="/research-diary/theme-init.js"></script>
  <link rel="stylesheet" href="/research-diary/style.css">
  <link rel="stylesheet" href="/research-diary/write/style.css">
</head>
<body>
  {% include research-header.html %}
  <main class="write-wrap">
    <div class="write-heading"><h1>Writing</h1></div>
    <div class="workspace-controls">
      <details id="github-panel" class="connection-panel">
        <summary>GitHub <span id="connection-state" class="connection-state">Disconnected</span></summary>
        <div class="connection-row"><label class="visually-hidden" for="github-token">GitHub token</label><input id="github-token" type="password" placeholder="GitHub token" autocomplete="off" spellcheck="false"><button id="connect-button" type="button">Connect</button><button id="disconnect-button" type="button" hidden>Disconnect</button></div>
      </details>
    </div>
    <form id="entry-form" novalidate>
      <fieldset id="note-fields">
        <legend class="visually-hidden">Note</legend>
        <div class="entry-fields">
          <label class="field field-title" for="entry-title">Title<input id="entry-title" type="text" maxlength="160" required></label>
          <label class="field" for="entry-category">Category<select id="entry-category"><option value="Day-Note">Day-Note</option><option value="Week-Note">Week-Note</option></select></label>
        </div>
        <div id="day-editors"></div>
        <div id="week-editor" hidden></div>
      </fieldset>
      <div class="editor-bottom"><span id="draft-state" class="draft-state" role="status"></span><button id="save-entry" type="submit">Save</button></div>
    </form>
    <p id="editor-status" class="editor-status" role="status" aria-live="polite"></p>
    <a id="published-link" class="published-link" hidden></a>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  </main>
  {% include research-footer.html %}
  <script src="/research-diary/vendor/marked.umd.js" defer></script>
  <script src="/research-diary/vendor/purify.min.js" defer></script>
  <script src="/research-diary/vendor/js-yaml.umd.min.js" defer></script>
  <script src="/research-diary/write/editor.js" defer></script>
</body>
</html>
